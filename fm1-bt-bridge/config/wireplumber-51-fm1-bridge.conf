# FM-1 Bluetooth bridge (WirePlumber 0.5+, Raspberry Pi OS Trixie and later).
# Headless: keep Bluetooth audio running without a logged-in desktop seat, and act only as an
# A2DP source (the Pi sends audio to headphones; no hands-free mic profile). PipeWire's own BLE
# MIDI server is off: the bridge's blemidi.py provides the MIDI service.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    monitor.bluez-midi = disabled
  }
}

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source ]
}

# USB sound (the FM-1s, a keyboard's own synth) gets more slack: with more than one plugged in, all but the one
# that keeps the clock are re-timed to it, and with the default 512 samples that correction over-shoots on a
# Pi Zero (warble and crackle). The re-timing only corrects a tiny clock difference, so a light resampler does
# it: the default one costs a Zero W (no SIMD) about 10% of its CPU for each source
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-.*" } ]
    actions = { update-props = { api.alsa.headroom = 2048, resample.quality = 1 } }
  }
  # An FM-1 keeps the clock (the graph's driver) and everything else is re-timed to it. Without this PipeWire
  # picked one by itself, and with an SMK-37 running Clipper plugged in it picked that: the Pi's headphone jack
  # couldn't follow it (1293 xruns in a minute) and every cycle crackled (2026-10-24). A Clipper alone (an FM-1
  # running Clipper) still drives: nothing outranks it then.
  {
    matches = [ { node.name = "~alsa_input.usb-.*(Felucca|SLOOP|Sloop).*" } ]
    actions = { update-props = { priority.driver = 3000 } }
  }
  # The Pi's own 3.5 mm jack (bcm2835): more slack, re-timed lightly, never the clock
  {
    matches = [ { node.name = "~alsa_output.platform-.*(mailbox|bcm2835).*" } ]
    actions = { update-props = { api.alsa.headroom = 2048, resample.quality = 1, priority.driver = 100 } }
  }
]
