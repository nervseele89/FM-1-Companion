# FM-1 Bluetooth bridge: larger buffers for the Pi Zero W's single core.
# Measured on a Zero W streaming the FM-1 to a JBL Go 3: 1024 frames gave several xruns a minute,
# 2048 (43 ms at 48 kHz) none. It adds little next to Bluetooth's own 150-250 ms.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 2048
    default.clock.max-quantum   = 4096
}
