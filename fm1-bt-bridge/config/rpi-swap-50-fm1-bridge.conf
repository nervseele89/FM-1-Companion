# FM-1 Companion: compressed swap in RAM only (installed to /etc/rpi/swap.conf.d/). The default "auto" on a Zero W
# backs zram with a 426 MB file in /var/swap that rpi-resize-swap-file rebuilds on every boot: ~20 s that the
# whole boot (and so the Companion) waits for. The Companion uses ~160 MB of the 426 MB of RAM.
[Main]
Mechanism=zram
